<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding and responsive viewport settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main Calculator Container -->
    <main class="calculator-wrapper">
        <div class="calculator">
            <!-- Display Screen for inputs and calculation results -->
            <input type="text" class="display" id="display" disabled placeholder="0" aria-label="Calculator Display">

            <!-- Keypad Buttons Grid -->
            <div class="keys">
                <!-- Row 1: Backspace, AC, %, Division -->
                <button class="button btn-action btn-backspace" onclick="deleteLast()" aria-label="Delete">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                        <line x1="18" y1="9" x2="12" y2="15"></line>
                        <line x1="12" y1="9" x2="18" y2="15"></line>
                    </svg>
                </button>
                <button class="button btn-action" onclick="clearDisplay()">AC</button>
                <button class="button btn-action" onclick="appendOperator('%')">%</button>
                <button class="button btn-operator" onclick="appendOperator('÷')">÷</button>

                <!-- Row 2: Numbers & Multiplication -->
                <button class="button btn-number" onclick="appendNumber(7)">7</button>
                <button class="button btn-number" onclick="appendNumber(8)">8</button>
                <button class="button btn-number" onclick="appendNumber(9)">9</button>
                <button class="button btn-operator" onclick="appendOperator('×')">×</button>

                <!-- Row 3: Numbers & Subtraction -->
                <button class="button btn-number" onclick="appendNumber(4)">4</button>
                <button class="button btn-number" onclick="appendNumber(5)">5</button>
                <button class="button btn-number" onclick="appendNumber(6)">6</button>
                <button class="button btn-operator" onclick="appendOperator('−')">−</button>

                <!-- Row 4: Numbers & Addition -->
                <button class="button btn-number" onclick="appendNumber(1)">1</button>
                <button class="button btn-number" onclick="appendNumber(2)">2</button>
                <button class="button btn-number" onclick="appendNumber(3)">3</button>
                <button class="button btn-operator" onclick="appendOperator('+')">+</button>

                <!-- Row 5: Plus/Minus, Zero, Decimal & Equals -->
                <button class="button btn-number btn-plus-minus" onclick="toggleSign()">+/−</button>
                <button class="button btn-number" onclick="appendNumber(0)">0</button>
                <button class="button btn-number" onclick="appendDecimal()">.</button>
                <button class="button btn-operator btn-equals" onclick="calculate()">=</button>
            </div>
        </div>
    </main>

    <!-- Link to external JavaScript file for full functionality -->
    <script src="script.js"></script>
</body>
</html>
